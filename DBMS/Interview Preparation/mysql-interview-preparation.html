tip:"The key phrase: 'a view is a saved SELECT, a procedure is saved logic' — clean, quotable, and accurate.",
follow:["Can a view call a function? Can it call a procedure?","Which one would you use to expose a read-only reporting dataset to another team?"],
difficulty:"Intermediate", importance:"important"});

/* ---------------- NORMALIZATION ---------------- */
add('normalization',{q:"Why do we normalize a database, using a simple example?",
short:"Normalization organizes data to eliminate redundancy and avoid update anomalies — so a single fact is stored in exactly one place, and changing it never risks leaving stale, inconsistent copies elsewhere. Example: storing department_name in every employee row means renaming a department requires updating every single employee row instead of one row in a departments table.",
detail:"Without normalization, insert/update/delete anomalies creep in — e.g. you can't record a new department until you have an employee in it, or deleting the last employee in a department accidentally deletes all knowledge that the department exists.",
sql:"-- Unnormalized: department_name repeated on every row\n-- employees(id, name, department_name, department_location)\n\n-- Normalized: department stored once\n-- departments(id, name, location)\n-- employees(id, name, department_id)",
tip:"Use exactly this employees/departments example — it's the most universally recognized illustration for this question.",
follow:["What's an update anomaly versus a delete anomaly?","Is a fully normalized schema always the right choice for a reporting/analytics database?"],
difficulty:"Basic", importance:"must"});

add('normalization',{q:"Explain 1NF, 2NF, and 3NF simply.",
short:"1NF requires atomic values — no repeating groups or comma-separated lists in a single column, and each row uniquely identifiable. 2NF requires 1NF plus no partial dependency — every non-key column must depend on the whole composite primary key, not just part of it. 3NF requires 2NF plus no transitive dependency — non-key columns must depend only on the key, not on other non-key columns.",
detail:"A concrete transitive-dependency example: storing both department_id and department_location on the employees table violates 3NF, because department_location depends on department_id, not directly on the employee — it should live in the departments table instead.",
sql:"-- Violates 3NF: department_location depends on department_id, not employee id\n-- employees(id, name, department_id, department_location)\n\n-- 3NF-compliant:\n-- employees(id, name, department_id)\n-- departments(id, location)",
tip:"Use one running example across all three normal forms — jumping between unrelated examples per form is confusing and weaker in an interview.",
follow:["What's the difference between a partial and a transitive dependency?","What normal form addresses multi-valued dependencies (hint: 4NF)?"],
difficulty:"Intermediate", importance:"must"});

add('normalization',{q:"Normalization vs Denormalization — when would you deliberately denormalize?",
short:"Normalization minimizes redundancy for data integrity and easier writes; denormalization intentionally reintroduces some redundancy (like storing a precomputed total or a duplicated department_name) to reduce the number of joins needed and speed up reads.",
detail:"Denormalization is common in reporting/analytics tables, caching layers, or read-heavy systems where join cost outweighs the risk of redundant data, as long as there's a clear, controlled process (like triggers or scheduled jobs) keeping the duplicated data in sync.",
sql:"-- Denormalized reporting table example\nCREATE TABLE order_summary(\n  order_id INT,\n  customer_name VARCHAR(100), -- duplicated from customers table\n  total_amount DECIMAL(10,2)  -- precomputed, avoids SUM(join) at read time\n);",
tip:"Always pair denormalization with 'but you need a plan to keep it in sync' — that caveat is what separates a thoughtful answer from a naive one.",
follow:["How do you keep denormalized data consistent with its source of truth?","Would you denormalize an OLTP system or an OLAP/reporting system more readily, and why?"],
difficulty:"Intermediate", importance:"important"});

{title:"Two users try to buy the last unit of a product at the same time.",
points:["This is a classic race condition: both transactions read stock = 1 before either writes.",
"Wrap the check-and-decrement in one transaction using an atomic UPDATE ... WHERE stock > 0, or SELECT ... FOR UPDATE to lock the row first.",
"Check ROW_COUNT() after the UPDATE — if 0 rows changed, someone else already took the last unit; roll back that order cleanly.",
"This avoids both overselling and the need for the application to coordinate locking itself."]},

{title:"A query using JOIN suddenly became slow after months of running fine.",
points:["Run EXPLAIN first to see the current execution plan — check the 'type' and 'key' columns for a full scan or missing index.",
"Data volume growth is the most common cause: an index that was 'good enough' at 10k rows may not scale to 10M rows the same way.",
"Check whether a recent schema change dropped or altered an index, or whether statistics are stale (ANALYZE TABLE can help).",
"Verify the JOIN condition itself still uses indexed, type-matching columns — an implicit type mismatch silently disables index usage."]},

{title:"A stored procedure is taking too long to execute.",
points:["Break the procedure into its component SQL statements and run each one individually with EXPLAIN to isolate the slow part.",
"Check for cursors or row-by-row loops doing what a single set-based query could do instead — set-based operations are almost always faster.",
"Look for missing indexes on tables the procedure filters or joins internally, and check the performance_schema for its actual runtime breakdown.",
"Confirm the procedure isn't unnecessarily holding a transaction open while doing slow, unrelated work in the middle."]},

{title:"Two transactions are waiting on each other indefinitely.",
points:["This is a deadlock — Transaction A holds a lock Transaction B needs, and vice versa.",
"InnoDB's deadlock detector identifies this automatically and rolls back one of the transactions to break the cycle.",

   DIFFERENCES TABLE
   ============================================================ */
const DIFFS = [
{a:"Stored Procedure", b:"Function", diff:"Procedure can return many/no result sets and can't be used inline; Function returns exactly one value and can be used inside SELECT.", ex:"CALL proc(); vs SELECT func(col) FROM t;", when:"Function for reusable calculations in queries; Procedure for multi-step business logic."},
{a:"Stored Procedure", b:"Trigger", diff:"Procedure runs only when explicitly called; Trigger fires automatically on INSERT/UPDATE/DELETE.", ex:"CALL update_stock(); vs AFTER UPDATE trigger logging changes.", when:"Trigger for invariants that must always hold; Procedure for on-demand operations."},
{a:"INNER JOIN", b:"LEFT JOIN", diff:"INNER JOIN returns only matching rows from both sides; LEFT JOIN returns all left rows plus matches (NULL if none).", ex:"Employees with a department vs all employees, department or not.", when:"INNER JOIN when both sides must exist; LEFT JOIN to find or preserve unmatched rows."},
{a:"JOIN", b:"Subquery", diff:"JOIN combines and returns columns from both tables; Subquery is typically used just to filter or check a condition.", ex:"JOIN orders to list order details vs subquery to filter customers who ordered.", when:"JOIN when you need columns from both tables; Subquery when you only need a condition."},
{a:"JOIN", b:"EXISTS", diff:"JOIN can duplicate outer rows on multiple matches; EXISTS only checks existence and never duplicates rows.", ex:"JOIN orders (may repeat customer) vs EXISTS (customer appears once).", when:"EXISTS when you just need a yes/no filter with no duplication risk."},
{a:"WHERE", b:"HAVING", diff:"WHERE filters individual rows before grouping; HAVING filters groups after aggregation and can use aggregate functions.", ex:"WHERE status='active' vs HAVING COUNT(*) > 5.", when:"WHERE for row-level filters; HAVING for group-level/aggregate filters."},
{a:"UNION", b:"JOIN", diff:"UNION stacks rows from two queries vertically (same columns); JOIN combines columns from two tables horizontally based on a matching condition.", ex:"UNION of two customer lists vs JOIN of customers to orders.", when:"UNION to merge similar result sets; JOIN to combine related data."},
{a:"PRIMARY KEY", b:"UNIQUE", diff:"Only one PRIMARY KEY per table, disallows NULL; multiple UNIQUE constraints allowed, each permits one NULL.", ex:"id PRIMARY KEY vs email UNIQUE.", when:"PRIMARY KEY for row identity; UNIQUE for other must-be-distinct columns."},
{a:"PRIMARY KEY", b:"FOREIGN KEY", diff:"PRIMARY KEY uniquely identifies rows in its own table; FOREIGN KEY references a primary/unique key in another table.", ex:"employees.id (PK) vs employees.department_id referencing departments.id (FK).", when:"Use FK whenever a column represents a relationship to another table's row."},
{a:"DELETE", b:"TRUNCATE", diff:"DELETE removes rows individually, can use WHERE, fires triggers, and is transaction-safe with rollback; TRUNCATE removes all rows at once, resets AUTO_INCREMENT, and can't be selectively filtered.", ex:"DELETE FROM t WHERE id=5; vs TRUNCATE TABLE t;", when:"DELETE for selective or logged removal; TRUNCATE to fully and quickly empty a table."},
{a:"COMMIT", b:"ROLLBACK", diff:"COMMIT permanently saves all changes in the current transaction; ROLLBACK undoes them, reverting to the state before the transaction began.", ex:"COMMIT after a successful transfer vs ROLLBACK after a failed validation.", when:"ROLLBACK whenever any step in the transaction fails or fails validation."},
{a:"Normalization", b:"Denormalization", diff:"Normalization minimizes redundancy for data integrity; Denormalization reintroduces controlled redundancy to speed up reads.", ex:"Separate departments table vs department_name duplicated on every employee row.", when:"Normalize OLTP systems; denormalize read-heavy reporting/analytics tables."},
{a:"Index", b:"Composite Index", diff:"A single-column index speeds up filters on one column; a composite index spans multiple columns and only helps queries using its leftmost columns.", ex:"INDEX(email) vs INDEX(customer_id, order_date).", when:"Composite index when queries commonly filter on the same combination of columns together."},
{a:"View", b:"Table", diff:"A table physically stores data; a view stores only a query definition and computes results live each time it's queried.", ex:"CREATE TABLE vs CREATE VIEW ... AS SELECT ...", when:"View to simplify or restrict access to a query; Table to actually persist data."},
{a:"View", b:"Stored Procedure", diff:"A view is a saved SELECT queried like a table; a procedure is saved logic invoked with CALL, supporting multi-step operations and writes.", ex:"SELECT * FROM active_employees vs CALL archive_inactive_employees();", when:"View for read-shaping data; Procedure for multi-step logic or writes."},
{a:"RANK", b:"DENSE_RANK", diff:"RANK leaves gaps in the ranking sequence after ties (1,1,3); DENSE_RANK does not (1,1,2).", ex:"Two employees tied for 1st: RANK gives next place 3, DENSE_RANK gives 2.", when:"DENSE_RANK when you want compact rank numbers with no skipped values."},
{a:"COUNT(*)", b:"COUNT(column)", diff:"COUNT(*) counts every row regardless of NULLs; COUNT(column) counts only rows where that column is NOT NULL.", ex:"COUNT(*) = 100 but COUNT(phone) = 82 if 18 rows have no phone.", when:"Use COUNT(column) whenever you specifically need non-NULL coverage of that field."},
];

  const done = state.done.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ============================================================
   RENDER: SIDEBAR
   ============================================================ */
function topicCount(id){
  if(id==='top40') return TOP40.length;
  if(id==='sqlcoding') return SQLCODING.length;
  if(id==='scenarios') return SCENARIOS.length;
  if(id==='differences') return DIFFS.length;
  return Q.filter(x=>x.topic===id).length;
}
function renderNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = TOPICS.map(t=>`
    <li><button data-topic="${t.id}" class="${state.topic===t.id?'active':''}">
      <span>${t.label}</span><span class="count">${topicCount(t.id)}</span>
    </button></li>
  `).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.topic = b.dataset.topic; state.bookmarksOnly=false; document.getElementById('bookmarkFilterBtn').classList.remove('on'); render(); closeSidebarMobile(); window.scrollTo(0,0);});
  });
}

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function matchesSearch(text){
  if(!state.search) return true;
  return text.toLowerCase().includes(state.search.toLowerCase());
}
function matchesDiff(item){
  if(state.diff==='all') return true;
  if(state.diff==='must') return item.importance==='must';
  if(state.diff==='important') return item.importance==='important';
  return item.difficulty===state.diff;
}

/* ============================================================
   RENDER: QUESTION CARD (for deep-dive Q bank)
   ============================================================ */
function renderQCard(item, idx){
  const isDone = state.done.includes(item.id);
  const isBookmarked = state.bookmarks.includes(item.id);
  const sqlBlock = item.sql ? `
    <div class="qblock">
      <h4>SQL Example</h4>
      <pre class="sql"><button class="copy-btn" data-copy>Copy</button><code>${escapeHtml(item.sql)}</code></pre>
    </div>` : '';
  return `
  <div class="qcard" data-id="${item.id}">
    <div class="qhead">
      <span class="qnum">${String(idx+1).padStart(2,'0')}</span>
      <span class="qtext">${escapeHtml(item.q)}</span>
      <div class="qmeta">
        ${item.importance==='must' ? '<span class="star">⭐</span>' : ''}
        <span class="tag ${item.difficulty}">${item.difficulty}</span>
        <button class="bookmark-btn ${isBookmarked?'on':''}" data-bookmark="${item.id}" title="Bookmark">${isBookmarked?'★':'☆'}</button>
        <button class="done-check ${isDone?'on':''}" data-done="${item.id}" title="Mark completed">✓</button>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
    <div class="qbody"><div class="qbody-inner">
      <div class="qblock"><h4>Short Interview Answer</h4><p>${escapeHtml(item.short)}</p></div>
      <div class="qblock"><h4>Detailed Explanation</h4><p>${escapeHtml(item.detail)}</p></div>
      ${sqlBlock}
      <div class="qblock"><h4>Interview Tip</h4><p>${escapeHtml(item.tip)}</p></div>
      <div class="qblock"><h4>Follow-up Questions</h4><ul class="followups">${item.follow.map(f=>`<li>${escapeHtml(f)}</li>`).join('')}</ul></div>
    </div></div>
  </div>`;
}

function renderTop40Card(item, idx){
  const id = 'top40_'+idx;
  const isDone = state.done.includes(id);
  return `
  <div class="qcard" data-id="${id}">
    <div class="qhead">
      <span class="qnum">${String(idx+1).padStart(2,'0')}</span>
      <span class="qtext">${escapeHtml(item[1])}</span>
      <div class="qmeta">
        <span class="tag must">${escapeHtml(item[0])}</span>
        <button class="done-check ${isDone?'on':''}" data-done="${id}" title="Mark completed">✓</button>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
    <div class="qbody"><div class="qbody-inner">
      <div class="qblock"><h4>Short Interview Answer</h4><p>${escapeHtml(item[2])}</p></div>
    </div></div>
  </div>`;
}

function renderSqlCard(item, idx){
  const id = 'sql_'+idx;
  const isDone = state.done.includes(id);
  const isBookmarked = state.bookmarks.includes(id);
  return `
  <div class="qcard" data-id="${id}">
    <div class="qhead">
      <span class="qnum">${String(idx+1).padStart(2,'0')}</span>
      <span class="qtext">${escapeHtml(item.q)}</span>
      <div class="qmeta">
        <button class="bookmark-btn ${isBookmarked?'on':''}" data-bookmark="${id}" title="Bookmark">${isBookmarked?'★':'☆'}</button>
        <button class="done-check ${isDone?'on':''}" data-done="${id}" title="Mark completed">✓</button>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
    <div class="qbody"><div class="qbody-inner">
      <div class="qblock"><h4>Sample Table Structure</h4><p class="mono">${escapeHtml(item.setup)}</p></div>
      <div class="qblock"><h4>SQL Query</h4><pre class="sql"><button class="copy-btn" data-copy>Copy</button><code>${escapeHtml(item.sql)}</code></pre></div>
      <div class="qblock"><h4>Explanation</h4><p>${escapeHtml(item.explain)}</p></div>
      <div class="qblock"><h4>Interview Follow-up</h4><p>${escapeHtml(item.follow)}</p></div>
    </div></div>
  </div>`;

function renderScenarioCard(item, idx){
  const id = 'scn_'+idx;
  const isDone = state.done.includes(id);
  return `
  <div class="qcard" data-id="${id}">
    <div class="qhead">
      <span class="qnum">${String(idx+1).padStart(2,'0')}</span>
      <span class="qtext">${escapeHtml(item.title)}</span>
      <div class="qmeta">
        <button class="done-check ${isDone?'on':''}" data-done="${id}" title="Mark completed">✓</button>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
    <div class="qbody"><div class="qbody-inner">
      <div class="qblock"><h4>How to Approach It</h4><ul>${item.points.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul></div>
    </div></div>
  </div>`;
}

function renderDiffTable(list){
  return `<table class="diff-table">
    <thead><tr><th>${''}</th><th>Difference</th><th>Example</th><th>When to Use</th></tr></thead>
    <tbody>${list.map(d=>`
      <tr><td><strong>${escapeHtml(d.a)}</strong><br><span style="color:var(--text-faint)">vs</span> <strong>${escapeHtml(d.b)}</strong></td>
      <td>${escapeHtml(d.diff)}</td>
      <td class="mono" style="font-size:12px">${escapeHtml(d.ex)}</td>
      <td>${escapeHtml(d.when)}</td></tr>
    `).join('')}</tbody>
  </table>`;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  renderNav();
  const content = document.getElementById('content');
  let html = '';

  if(state.topic==='top40'){
    html += heroBlock('🔥 Top 40 MySQL Interview Questions','The 40 highest-priority questions across every topic — start here if time is short.');
    let items = TOP40.map((t,i)=>({t,i})).filter(({t,i})=>{
      const id='top40_'+i;
      if(state.bookmarksOnly && !state.bookmarks.includes(id)) return false;
      return matchesSearch(t[0]+' '+t[1]+' '+t[2]);
    });
    html += `<div class="top40-grid">${items.length ? items.map(({t,i})=>renderTop40Card(t,i)).join('') : emptyBlock()}</div>`;

  } else if(state.topic==='sqlcoding'){
    html += heroBlock('💻 SQL Coding Questions','~25 practical coding questions covering joins, aggregates, subqueries, procedures, and more.');
    let items = SQLCODING.map((s,i)=>({s,i})).filter(({s,i})=>{
      const id='sql_'+i;
      if(state.bookmarksOnly && !state.bookmarks.includes(id)) return false;
      return matchesSearch(s.q+' '+s.explain);
    });
    html += items.length ? items.map(({s,i})=>renderSqlCard(s,i)).join('') : emptyBlock();

  } else if(state.topic==='scenarios'){
    html += heroBlock('Scenario-Based Questions','~20 real-world situations interviewers use to test practical judgment, not just syntax.');
    let items = SCENARIOS.map((s,i)=>({s,i})).filter(({s,i})=>matchesSearch(s.title+' '+s.points.join(' ')));
    html += items.length ? items.map(({s,i})=>renderScenarioCard(s,i)).join('') : emptyBlock();

  } else if(state.topic==='differences'){
    html += heroBlock('⚡ Common Interview Differences','The comparison pairs interviewers ask most — difference, example, and when to use each.');
    let items = DIFFS.filter(d=>matchesSearch(d.a+' '+d.b+' '+d.diff));
    html += items.length ? renderDiffTable(items) : emptyBlock();

  } else {
    const topicMeta = TOPICS.find(t=>t.id===state.topic);
    html += heroBlock(topicMeta.label, topicDescription(state.topic));
    let items = Q.filter(q=>q.topic===state.topic).filter(item=>{
      if(state.bookmarksOnly && !state.bookmarks.includes(item.id)) return false;
      if(!matchesDiff(item)) return false;
      return matchesSearch(item.q+' '+item.short+' '+item.detail);
    });
    html += items.length ? items.map((item,i)=>renderQCard(item,i)).join('') : emptyBlock();
  }

  content.innerHTML = html;
  attachContentHandlers();
  updateProgress();
}

function heroBlock(title, sub){
  return `<div class="hero"><div class="eyebrow">mysql &gt; SELECT * FROM interview_prep;</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(sub)}</p></div>`;
}
function emptyBlock(){
  return `<div class="empty"><h3>No results</h3><p>Try a different search term or clear your filters.</p></div>`;
}
function topicDescription(id){
  const map = {
    procedures:"CREATE PROCEDURE, parameters, control flow, error handling, and how procedures compare to functions and triggers.",
    functions:"Built-in and user-defined functions, NULL handling, and when a function beats writing logic in the application.",
    joins:"The most heavily-tested topic — every join type, multi-table joins, and the classic JOIN interview problems.",
    indexes:"B-trees, composite indexes, the leftmost-prefix rule, covering indexes, and reading EXPLAIN output.",
    transactions:"COMMIT, ROLLBACK, SAVEPOINT, ACID, and MySQL's isolation levels.",
    concurrency:"Race conditions, lost updates, locking, deadlocks, and how to prevent overselling under concurrent load.",
    constraints:"PRIMARY KEY, FOREIGN KEY, UNIQUE, and the key-type vocabulary interviewers expect you to use precisely.",
    aggregate:"COUNT, SUM, AVG, GROUP BY, HAVING, and the WHERE-vs-HAVING distinction.",
    subqueries:"Single-row, multi-row, and correlated subqueries, plus the NOT IN / NULL trap.",
    views:"What a view is, when it's updatable, and how it compares to tables and procedures.",
    normalization:"1NF through 3NF with one running example, plus when denormalization is the right call.",
  };
  return map[id] || '';
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function attachContentHandlers(){
  document.querySelectorAll('.qhead').forEach(h=>{
    h.addEventListener('click', (e)=>{
      if(e.target.closest('[data-bookmark]') || e.target.closest('[data-done]')) return;
      h.parentElement.classList.toggle('open');
    });
  });
  document.querySelectorAll('[data-bookmark]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = b.dataset.bookmark;
      const idx = state.bookmarks.indexOf(id);
      if(idx>-1) state.bookmarks.splice(idx,1); else state.bookmarks.push(id);
      saveBookmarks();
      render();
    });
  });
  document.querySelectorAll('[data-done]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = b.dataset.done;
      const idx = state.done.indexOf(id);
      if(idx>-1) state.done.splice(idx,1); else state.done.push(id);
      saveDone();
      render();
    });
  });
  document.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const code = btn.nextElementSibling.textContent;
      navigator.clipboard.writeText(code).then(()=>{
        btn.textContent = 'Copied!'; btn.classList.add('copied');
        setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('copied');}, 1500);
      }).catch(()=>{ btn.textContent = 'Select & Copy'; });
    });
  });
}

/* Search */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  state.search = e.target.value;
  render();
});

/* Difficulty filters */
document.querySelectorAll('#difficultyFilters .chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('#difficultyFilters .chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    state.diff = chip.dataset.diff;
    render();
  });
});

/* Bookmark filter */
document.getElementById('bookmarkFilterBtn').addEventListener('click', ()=>{
  state.bookmarksOnly = !state.bookmarksOnly;
  document.getElementById('bookmarkFilterBtn').classList.toggle('on', state.bookmarksOnly);
  render();
});

/* Theme toggle */
const themeBtn = document.getElementById('themeToggle');
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('mysql_theme', t);
  themeBtn.textContent = t==='light' ? '☀️ Light' : '🌙 Dark';
}
setTheme(localStorage.getItem('mysql_theme') || 'dark');
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur==='light' ? 'dark' : 'light');
});

/* Mobile sidebar */
const sidebar = document.getElementById('sidebar');
document.getElementById('menuToggle').addEventListener('click', ()=> sidebar.classList.toggle('open'));
function closeSidebarMobile(){ if(window.innerWidth<=900) sidebar.classList.remove('open'); }

/* Print */
document.getElementById('printBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.qcard').forEach(c=>c.classList.add('open'));
  setTimeout(()=>window.print(), 50);
});

/* ============================================================
   INTERVIEW MODE
   ============================================================ */
const mustKnowPool = [
  ...Q.filter(q=>q.importance==='must').map(q=>({q:q.q, a:q.short})),
  ...TOP40.map(t=>({q:t[1], a:t[2]}))
];
let imOrder = [];
let imIndex = 0;
let imAnswered = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function startInterviewMode(){
  imOrder = shuffle(mustKnowPool);
  imIndex = 0; imAnswered = 0;
  document.getElementById('imOverlay').classList.add('show');
  showImQuestion();
}
function showImQuestion(){
  const item = imOrder[imIndex];
  document.getElementById('imQuestion').textContent = item.q;
  const ans = document.getElementById('imAnswer');
  ans.textContent = item.a;
  ans.classList.remove('show');
  document.getElementById('imProgress').textContent = `Question ${imIndex+1} / ${imOrder.length} · Answered: ${imAnswered}`;
}
document.getElementById('interviewModeBtn').addEventListener('click', startInterviewMode);
document.getElementById('imClose').addEventListener('click', ()=> document.getElementById('imOverlay').classList.remove('show'));
document.getElementById('imReveal').addEventListener('click', ()=>{
  document.getElementById('imAnswer').classList.add('show');
});
document.getElementById('imNext').addEventListener('click', ()=>{
  if(document.getElementById('imAnswer').classList.contains('show')) imAnswered++;
  imIndex++;
  if(imIndex >= imOrder.length){ imOrder = shuffle(mustKnowPool); imIndex = 0; }
  showImQuestion();
});

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
