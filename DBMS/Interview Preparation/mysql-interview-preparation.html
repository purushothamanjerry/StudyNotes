<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySQL Interview Preparation</title>
<style>
:root{
  --bg:#0a0e14;
  --bg-elev:#0f1520;
  --card:#131a26;
  --card-hover:#182236;
  --border:#212b3d;
  --text:#e4e9f2;
  --text-dim:#8a94a8;
  --text-faint:#5c6579;
  --accent:#4fd8c4;
  --accent-dim:#2a9d8f33;
  --gold:#f0b429;
  --red:#f2555f;
  --blue:#5b9dff;
  --mono:ui-monospace,SFMono-Regular,'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius:10px;
}
[data-theme="light"]{
  --bg:#f5f6f8;
  --bg-elev:#ffffff;
  --card:#ffffff;
  --card-hover:#f0f2f6;
  --border:#dfe3ea;
  --text:#1a2130;
  --text-dim:#5c657a;
  --text-faint:#8a94a8;
  --accent:#0f9d8f;
  --accent-dim:#0f9d8f22;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  line-height:1.55;min-height:100vh;transition:background .25s,color .25s;
}
::selection{background:var(--accent);color:#04151a}
a{color:var(--accent)}
button{font-family:var(--sans);cursor:pointer}
code,.mono{font-family:var(--mono)}

/* ===== layout shell ===== */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}

/* ===== sidebar ===== */
.sidebar{
  background:var(--bg-elev);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px;
  display:flex;flex-direction:column;gap:18px;z-index:40;
}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px #000a}
  .sidebar.open{transform:translateX(0)}
}
.brand{padding:6px 8px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.brand .prompt{font-family:var(--mono);font-size:12px;color:var(--accent);display:flex;align-items:center;gap:6px}
.brand .prompt .cursor{width:7px;height:14px;background:var(--accent);display:inline-block;animation:blink 1s steps(1) infinite}
.brand h1{font-size:16px;font-weight:700;margin-top:6px;letter-spacing:.2px}
@keyframes blink{50%{opacity:0}}

.progress-wrap{padding:0 8px}
.progress-label{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:6px;font-family:var(--mono)}
.progress-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px;transition:width .4s}

.navlist{list-style:none;display:flex;flex-direction:column;gap:2px}
.navlist button{
  all:unset;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text-dim);width:100%;
}
.navlist button:hover{background:var(--card-hover);color:var(--text)}
.navlist button.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.navlist .count{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);background:var(--bg);border:1px solid var(--border);padding:1px 6px;border-radius:99px}
.navlist button.active .count{color:var(--accent);border-color:var(--accent)}

.sidebar-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sidebar-btn{
  all:unset;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);
  padding:8px 10px;border-radius:8px;border:1px solid var(--border);justify-content:center;
}
.sidebar-btn:hover{background:var(--card-hover);color:var(--text)}

/* ===== main ===== */
main{min-width:0}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:12px 22px;
}
.menu-toggle{display:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px}
@media(max-width:900px){.menu-toggle{display:block}}
.search-box{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--border);border-radius:9px;padding:9px 12px;max-width:520px;
}
.search-box input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:13.5px}
.search-box svg{flex-shrink:0;opacity:.55}
.topbar-actions{display:flex;gap:8px;margin-left:auto}
.icon-btn{
  background:var(--card);border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:8px 11px;font-size:12.5px;display:flex;align-items:center;gap:6px;
}
.icon-btn:hover{color:var(--text);background:var(--card-hover)}
.icon-btn.on{color:var(--accent);border-color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px 0}
.chip{
  all:unset;font-size:12.5px;padding:6px 13px;border-radius:99px;border:1px solid var(--border);
  color:var(--text-dim);font-family:var(--mono);
}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent);color:#04151a;border-color:var(--accent);font-weight:600}

.content{padding:20px 22px 80px;max-width:980px}

.hero{padding:26px 4px 18px}
.hero .eyebrow{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.hero h2{font-size:26px;margin-top:8px;font-weight:700}
.hero p{color:var(--text-dim);margin-top:8px;font-size:14.5px;max-width:640px}

.section-title{font-size:12px;font-family:var(--mono);color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin:26px 4px 12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}

/* ===== question card ===== */
.qcard{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;transition:border-color .2s;
}
.qcard:hover{border-color:#3a465e}
.qcard .qhead{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;
}
.qcard .qnum{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:34px;flex-shrink:0}
.qcard .qtext{flex:1;font-size:14.5px;font-weight:600}
.qmeta{display:flex;gap:6px;align-items:center;flex-shrink:0}
.tag{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:99px;border:1px solid var(--border);color:var(--text-dim);white-space:nowrap}
.tag.basic{color:#7bd88f;border-color:#7bd88f44}
.tag.intermediate{color:var(--blue);border-color:#5b9dff44}
.tag.advanced{color:var(--red);border-color:#f2555f44}
.tag.must{color:var(--gold);border-color:#f0b42944}
.star{color:var(--gold);font-size:13px}
.chevron{transition:transform .2s;color:var(--text-faint);flex-shrink:0}
.qcard.open .chevron{transform:rotate(90deg)}
.bookmark-btn{background:none;border:none;color:var(--text-faint);font-size:15px;flex-shrink:0;padding:2px}
.bookmark-btn.on{color:var(--gold)}
.done-check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent}
.done-check.on{background:var(--accent);border-color:var(--accent);color:#04151a}

.qbody{max-height:0;overflow:hidden;transition:max-height .3s ease}
.qcard.open .qbody{max-height:4000px}
.qbody-inner{padding:0 16px 18px;border-top:1px solid var(--border);margin-top:0}
.qblock{margin-top:14px}
.qblock h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-family:var(--mono);margin-bottom:6px}
.qblock p,.qblock li{font-size:13.8px;color:var(--text);opacity:.92}
.qblock ul{padding-left:18px}
.followups{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px}
.followups li{font-size:13.3px;color:var(--text-dim);padding-left:14px;position:relative}
.followups li::before{content:"→";position:absolute;left:0;color:var(--accent)}

pre.sql{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;
  overflow-x:auto;font-family:var(--mono);font-size:12.8px;line-height:1.6;position:relative;margin-top:4px;color:#c9d6f0;
}
[data-theme="light"] pre.sql{color:#1a2130}
.copy-btn{
  position:absolute;top:8px;right:8px;background:var(--card);border:1px solid var(--border);
  color:var(--text-dim);font-size:10.5px;padding:4px 9px;border-radius:6px;font-family:var(--sans);
}
.copy-btn:hover{color:var(--text)}
.copy-btn.copied{color:var(--accent);border-color:var(--accent)}

/* ===== comparison table ===== */
.diff-table{width:100%;border-collapse:collapse;margin-bottom:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.diff-table th{background:var(--bg-elev);text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);font-family:var(--mono)}
.diff-table td{padding:10px 12px;font-size:13px;border-top:1px solid var(--border);vertical-align:top}
.diff-table tr:hover td{background:var(--card-hover)}

/* ===== interview mode ===== */
.im-overlay{position:fixed;inset:0;background:#000c;backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.im-overlay.show{display:flex}
.im-box{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:34px;max-width:620px;width:100%;text-align:center}
.im-progress{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-bottom:18px}
.im-q{font-size:19px;font-weight:700;margin-bottom:22px;min-height:60px;display:flex;align-items:center;justify-content:center}
.im-answer{display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:left;font-size:13.8px;color:var(--text-dim);margin-bottom:20px}
.im-answer.show{display:block}
.im-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{all:unset;padding:10px 20px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:#04151a}
.btn-primary:hover{opacity:.88}
.btn-ghost{border:1px solid var(--border);color:var(--text-dim)}
.btn-ghost:hover{color:var(--text)}
.im-close{position:absolute;top:18px;right:22px;color:var(--text-dim);font-size:22px;background:none;border:none}

.empty{padding:60px 10px;text-align:center;color:var(--text-faint)}
.empty h3{color:var(--text-dim);margin-bottom:6px;font-size:15px}

.top40-grid .qcard{border-left:2px solid var(--gold)}

@media print{
  .sidebar,.topbar,.filters,.menu-toggle,.bookmark-btn,.done-check,.copy-btn,.im-overlay{display:none!important}
  .shell{display:block}
  body{background:#fff;color:#000}
  .qbody{max-height:none!important}
  .qcard{border:1px solid #999;break-inside:avoid;margin-bottom:14px}
  pre.sql{background:#f4f4f4;color:#000;border-color:#ccc}
  .content{max-width:100%;padding:0}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="prompt">mysql&gt; <span class="cursor"></span></div>
      <h1>MySQL Interview Prep</h1>
    </div>

    <div class="progress-wrap">
      <div class="progress-label"><span>PREPARATION</span><span id="progressPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <ul class="navlist" id="navlist"></ul>

    <div class="sidebar-foot">
      <button class="sidebar-btn" id="interviewModeBtn">🎯 Interview Mode</button>
      <button class="sidebar-btn" id="printBtn">🖨 Print</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="searchInput" type="text" placeholder="Search interview questions...">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="bookmarkFilterBtn">★ Bookmarks</button>
        <button class="icon-btn" id="themeToggle">🌙 Dark</button>
      </div>
    </div>

    <div class="filters" id="difficultyFilters">
      <button class="chip active" data-diff="all">All</button>
      <button class="chip" data-diff="must">⭐ Must Know</button>
      <button class="chip" data-diff="important">Important</button>
      <button class="chip" data-diff="Basic">Basic</button>
      <button class="chip" data-diff="Intermediate">Intermediate</button>
      <button class="chip" data-diff="Advanced">Advanced</button>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<div class="im-overlay" id="imOverlay">
  <div class="im-box">
    <button class="im-close" id="imClose">✕</button>
    <div class="im-progress" id="imProgress">Question 1 / 40 · Answered: 0</div>
    <div class="im-q" id="imQuestion"></div>
    <div class="im-answer" id="imAnswer"></div>
    <div class="im-actions">
      <button class="btn btn-ghost" id="imReveal">Reveal Answer</button>
      <button class="btn btn-primary" id="imNext">Next Question →</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const TOPICS = [
  {id:'top40', label:'🔥 Top 40 Questions'},
  {id:'procedures', label:'Stored Procedures'},
  {id:'functions', label:'Functions'},
  {id:'joins', label:'Joins'},
  {id:'indexes', label:'Indexes'},
  {id:'transactions', label:'Transactions'},
  {id:'concurrency', label:'Race Conditions'},
  {id:'constraints', label:'Constraints & Keys'},
  {id:'aggregate', label:'Aggregate Functions'},
  {id:'subqueries', label:'Subqueries'},
  {id:'views', label:'Views'},
  {id:'normalization', label:'Normalization'},
  {id:'sqlcoding', label:'💻 SQL Coding'},
  {id:'scenarios', label:'Scenario Questions'},
  {id:'differences', label:'⚡ Common Differences'},
];

// Deep-dive question bank. difficulty: Basic|Intermediate|Advanced, importance: must|important
let Q = [];
let qid = 0;
function add(topic, o){ qid++; Q.push(Object.assign({id:'q'+qid, topic}, o)); }

/* ---------------- STORED PROCEDURES ---------------- */
add('procedures',{q:"What is a stored procedure and why use one?",
short:"A stored procedure is a precompiled block of SQL stored in the database that you can call by name. It centralizes business logic on the server, reduces network round-trips, and lets multiple applications reuse the same validated logic.",
detail:"Stored procedures live inside the database and can contain variables, control flow, loops, and transactions. They're compiled once and cached, so repeated calls are faster than sending raw SQL every time, and they reduce the amount of data sent over the network since only the call and parameters travel, not the full query text.",
sql:"DELIMITER //\nCREATE PROCEDURE GetEmployeeCount(IN dept_id INT, OUT emp_count INT)\nBEGIN\n  SELECT COUNT(*) INTO emp_count\n  FROM employees WHERE department_id = dept_id;\nEND //\nDELIMITER ;\n\nCALL GetEmployeeCount(3, @count);\nSELECT @count;",
tip:"Mention centralization of logic, reduced network overhead, and reusability — interviewers want to hear you understand the 'why', not just the syntax.",
follow:["How would you handle errors inside a procedure?","Can a procedure call another procedure?"],
difficulty:"Basic", importance:"must"});

add('procedures',{q:"Explain IN, OUT, and INOUT parameters.",
short:"IN passes a value into the procedure (read-only, default type). OUT returns a value back to the caller. INOUT does both — it passes a value in and lets the procedure modify it and return the new value.",
detail:"IN parameters are copied into the procedure and any change inside doesn't affect the caller's variable. OUT parameters start as NULL and must be assigned inside the procedure before it ends. INOUT parameters carry the caller's value in, allow modification, and reflect back out.",
sql:"CREATE PROCEDURE AdjustSalary(INOUT sal DECIMAL(10,2), IN pct DECIMAL(5,2))\nBEGIN\n  SET sal = sal + (sal * pct / 100);\nEND;",
tip:"Give a one-line real example for each — interviewers often ask you to distinguish them quickly.",
follow:["What happens if you don't set an OUT parameter?","Can a function have OUT parameters?"],
difficulty:"Basic", importance:"important"});

add('procedures',{q:"How do you handle errors inside a stored procedure?",
short:"MySQL uses DECLARE ... HANDLER blocks to catch conditions like SQLEXCEPTION, SQLWARNING, or specific SQLSTATE / error codes, and respond with rollback, logging, or a custom message.",
detail:"A CONTINUE handler lets execution keep going after the error is handled; an EXIT handler stops the current block. Combined with transactions, an EXIT handler on SQLEXCEPTION is commonly used to ROLLBACK and re-signal a clean error to the caller.",
sql:"CREATE PROCEDURE SafeTransfer(IN src INT, IN dst INT, IN amt DECIMAL(10,2))\nBEGIN\n  DECLARE EXIT HANDLER FOR SQLEXCEPTION\n  BEGIN\n    ROLLBACK;\n    RESIGNAL;\n  END;\n\n  START TRANSACTION;\n  UPDATE accounts SET balance = balance - amt WHERE id = src;\n  UPDATE accounts SET balance = balance + amt WHERE id = dst;\n  COMMIT;\nEND;",
tip:"Tie error handling directly to transactions — that combination is what interviewers are really probing for.",
follow:["Difference between CONTINUE and EXIT handlers?","What is RESIGNAL used for?"],
difficulty:"Intermediate", importance:"must"});

add('procedures',{q:"Compare LOOP, WHILE, and REPEAT.",
short:"LOOP is an unconditional loop that needs an explicit LEAVE to exit. WHILE checks its condition before each iteration (may run zero times). REPEAT checks its condition after each iteration, so it always runs at least once.",
detail:"LOOP gives full manual control and is often used with a cursor and a handler for NOT FOUND to LEAVE. WHILE is the natural choice when you might skip the body entirely. REPEAT...UNTIL is the natural choice for 'do this, then check if I should stop' logic, similar to do-while in other languages.",
sql:"-- WHILE\nWHILE i <= 10 DO\n  SET total = total + i;\n  SET i = i + 1;\nEND WHILE;\n\n-- REPEAT\nREPEAT\n  SET i = i + 1;\nUNTIL i >= 10 END REPEAT;",
tip:"Anchor the difference with 'checks before' vs 'checks after' vs 'manual exit' — that phrase alone answers the question cleanly.",
follow:["When would you prefer a cursor over a loop on a result set?","How do you break out of a LOOP?"],
difficulty:"Basic", importance:"important"});

add('procedures',{q:"Stored Procedure vs Function — what's the real difference?",
short:"A function must return exactly one value and can be used inside a SELECT statement; a procedure can return zero, one, or many result sets (or none) and cannot be called from inside a query. Functions also can't modify data in most configurations, while procedures freely run DML and transactions.",
detail:"Because functions are used inline in expressions (SELECT calc_tax(price)), MySQL restricts them from statements like COMMIT or arbitrary DML in many modes. Procedures are called with CALL and are the right tool for multi-step business logic, transactions, and returning multiple result sets.",
sql:"-- Function\nCREATE FUNCTION CalcTax(amount DECIMAL(10,2)) RETURNS DECIMAL(10,2)\nDETERMINISTIC\nBEGIN\n  RETURN amount * 0.18;\nEND;\n\nSELECT product_id, CalcTax(price) FROM products;",
tip:"This is one of the most-asked differences — always mention 'usable inside SELECT' as the key practical distinction.",
follow:["Can a function call a procedure?","Why must functions typically be DETERMINISTIC or declare NO SQL / READS SQL DATA?"],
difficulty:"Basic", importance:"must"});

add('procedures',{q:"Stored Procedure vs Trigger — when do you use which?",
short:"A procedure runs only when explicitly called by an application or another routine. A trigger runs automatically in response to an INSERT, UPDATE, or DELETE on a specific table — you never call it directly.",
detail:"Triggers are ideal for enforcing invariants (audit logging, denormalized counters, validation) that must happen no matter which client performs the write. Procedures are ideal for explicit, on-demand multi-step operations initiated by the application.",
sql:"CREATE TRIGGER trg_audit_salary\nAFTER UPDATE ON employees\nFOR EACH ROW\nBEGIN\n  IF OLD.salary <> NEW.salary THEN\n    INSERT INTO salary_audit(emp_id, old_salary, new_salary, changed_at)\n    VALUES(OLD.id, OLD.salary, NEW.salary, NOW());\n  END IF;\nEND;",
tip:"Say 'triggers fire implicitly on data change, procedures run only when called' — that one sentence is the whole answer.",
follow:["What are the risks of relying heavily on triggers?","Can a trigger call a stored procedure?"],
difficulty:"Intermediate", importance:"important"});

add('procedures',{q:"What are the advantages and disadvantages of stored procedures?",
short:"Advantages: reduced network traffic, reusable centralized logic, better security through permission control, and precompiled execution. Disadvantages: harder to version-control and test than application code, vendor lock-in, and business logic split across two layers can hurt maintainability.",
detail:"Many teams now prefer keeping heavy business logic in the application layer and using procedures sparingly — for performance-critical batch operations or strict data-integrity rules — rather than as the primary place for logic.",
sql:null,
tip:"A balanced answer (pros AND cons) signals seniority — don't just praise stored procedures blindly.",
follow:["When would you avoid using stored procedures?","How do teams version-control stored procedures?"],
difficulty:"Basic", importance:"important"});

add('procedures',{q:"Can you run a transaction inside a stored procedure? Show an example.",
short:"Yes — START TRANSACTION, COMMIT, and ROLLBACK can all be used inside a procedure, typically paired with an exception handler so a failure anywhere rolls back the whole unit of work.",
detail:"This is the standard pattern for money transfers, inventory deductions, or any multi-table write that must be all-or-nothing. Wrapping it in a procedure also means the transaction boundary is guaranteed no matter which client calls it.",
sql:"CREATE PROCEDURE PlaceOrder(IN p_user INT, IN p_product INT, IN p_qty INT)\nBEGIN\n  DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN ROLLBACK; RESIGNAL; END;\n  START TRANSACTION;\n  UPDATE products SET stock = stock - p_qty WHERE id = p_product AND stock >= p_qty;\n  IF ROW_COUNT() = 0 THEN\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Insufficient stock';\n  END IF;\n  INSERT INTO orders(user_id, product_id, qty) VALUES(p_user, p_product, p_qty);\n  COMMIT;\nEND;",
tip:"This example (stock check + insert) is a favorite follow-up to race-condition questions — know it cold.",
follow:["How does this relate to preventing overselling?","What isolation level would you pair this with?"],
difficulty:"Advanced", importance:"must"});

/* ---------------- FUNCTIONS ---------------- */
add('functions',{q:"What is a user-defined function and how do you create one?",
short:"A user-defined function (UDF) is a named, reusable block of SQL that accepts parameters and returns a single value, which you can call inside expressions like SELECT, WHERE, or ORDER BY.",
detail:"Functions are defined with CREATE FUNCTION, must declare a RETURNS type, and must contain a RETURN statement. They're best for small, pure calculations you want to reuse across many queries.",
sql:"CREATE FUNCTION FullName(fname VARCHAR(50), lname VARCHAR(50))\nRETURNS VARCHAR(101)\nDETERMINISTIC\nBEGIN\n  RETURN CONCAT(fname, ' ', lname);\nEND;\n\nSELECT FullName(first_name, last_name) FROM employees;",
tip:"Mention DETERMINISTIC — interviewers often follow up on why it matters for replication and the query cache.",
follow:["What does DETERMINISTIC mean and why does MySQL care?","Can a function have a side effect like an INSERT?"],
difficulty:"Basic", importance:"must"});

add('functions',{q:"IFNULL vs COALESCE vs CASE for handling NULLs — when do you use each?",
short:"IFNULL(a,b) is MySQL-specific and handles exactly two arguments. COALESCE(a,b,c,...) is ANSI-standard and returns the first non-NULL value from any number of arguments. CASE WHEN is the most flexible, letting you branch on arbitrary conditions, not just NULL checks.",
detail:"For simple two-value fallback, IFNULL is concise. For a priority list of possible values, COALESCE is cleaner and portable across databases. When the logic is conditional rather than purely 'is it null', CASE is the right tool.",
sql:"SELECT product_name,\n  COALESCE(discount_price, sale_price, list_price) AS effective_price\nFROM products;",
tip:"Say 'COALESCE is the portable, N-argument version of IFNULL' — that's the exact distinction interviewers listen for.",
follow:["Is COALESCE evaluated lazily (short-circuited)?","How does NULL behave in arithmetic and comparisons?"],
difficulty:"Basic", importance:"must"});

add('functions',{q:"Name common string, date, and numeric built-in functions you use often.",
short:"String: CONCAT, SUBSTRING, TRIM, UPPER/LOWER, REPLACE, LENGTH. Date: NOW(), CURDATE(), DATEDIFF, DATE_ADD, DATE_FORMAT. Numeric: ROUND, CEIL, FLOOR, ABS, MOD.",
detail:"Being fluent with these avoids writing procedural code for things SQL already does well — e.g. computing age with TIMESTAMPDIFF instead of pulling data into the application to calculate it.",
sql:"SELECT name,\n  TIMESTAMPDIFF(YEAR, birth_date, CURDATE()) AS age,\n  DATE_FORMAT(hire_date, '%d %b %Y') AS hired\nFROM employees;",
tip:"Interviewers often just want to see you're comfortable reaching for built-ins instead of over-engineering.",
follow:["Difference between CHAR_LENGTH and LENGTH?","How do you add 30 days to a date?"],
difficulty:"Basic", importance:"important"});

add('functions',{q:"When should you use a function versus writing the logic in the application?",
short:"Use a database function when the logic needs to run close to the data — inside a query, across many rows, or shared by multiple applications hitting the same database. Keep logic in the application when it needs testing frameworks, version control alongside app code, or involves external calls.",
detail:"A function that just formats or derives a value used in reporting queries belongs in the database. Business rules that change frequently or are unit-tested extensively are usually safer in application code.",
sql:null,
tip:"A nuanced 'it depends, here's my rule of thumb' answer is stronger than a blanket rule.",
follow:["What are the performance implications of calling a function per row in a large SELECT?","Can functions be indexed indirectly via generated columns?"],
difficulty:"Intermediate", importance:"important"});

add('functions',{q:"What are aggregate functions and how do they differ from scalar functions?",
short:"Aggregate functions (COUNT, SUM, AVG, MIN, MAX) operate across a set of rows and collapse them into a single value per group. Scalar functions (UPPER, ROUND, NOW) operate on one row at a time and return one value per row.",
detail:"Aggregate functions are typically paired with GROUP BY; without it, they aggregate the entire result set into a single row. Mixing a non-aggregated column with an aggregate function in the same SELECT without GROUP BY causes errors or undefined results depending on SQL mode.",
sql:"SELECT department_id, COUNT(*) AS emp_count, AVG(salary) AS avg_salary\nFROM employees\nGROUP BY department_id;",
tip:"Clarify 'per row vs per group' — that framing instantly shows you understand the mental model.",
follow:["What happens with ONLY_FULL_GROUP_BY mode?","Can you use an aggregate function inside WHERE?"],
difficulty:"Basic", importance:"important"});

add('functions',{q:"Write a function that returns a customer's loyalty tier based on total spend.",
short:"A scalar function that takes total spend as input and returns a tier label using CASE, demonstrating both function syntax and branching logic in one example.",
detail:"This kind of function is commonly reused across reports, dashboards, and application queries so the tier logic stays in one place instead of being duplicated in multiple SELECT statements.",
sql:"CREATE FUNCTION LoyaltyTier(total_spend DECIMAL(10,2))\nRETURNS VARCHAR(10)\nDETERMINISTIC\nBEGIN\n  RETURN CASE\n    WHEN total_spend >= 10000 THEN 'Platinum'\n    WHEN total_spend >= 5000  THEN 'Gold'\n    WHEN total_spend >= 1000  THEN 'Silver'\n    ELSE 'Bronze'\n  END;\nEND;",
tip:"Walk through the CASE branches out loud — interviewers are watching your reasoning, not just the final code.",
follow:["How would you index a query that filters by this tier?","Would a generated column be better here than a function call per row?"],
difficulty:"Intermediate", importance:"important"});

/* ---------------- JOINS ---------------- */
const joinCommon = {difficulty:"Basic"};
add('joins',{q:"What does INNER JOIN do, and when do you use it?",
short:"INNER JOIN returns only the rows where the join condition matches in both tables — any row without a matching counterpart on either side is excluded entirely.",
detail:"Use INNER JOIN when you only care about records that definitely have a relationship on both sides, e.g. employees that do have an assigned department. It's the most common and usually the most performant join because the result set is naturally filtered.",
sql:"SELECT e.name, d.department_name\nFROM employees e\nINNER JOIN departments d ON e.department_id = d.id;",
tip:"Common trap: candidates forget INNER JOIN silently drops unmatched rows — call that out explicitly.",
follow:["What happens to NULL foreign keys in an INNER JOIN?","How is INNER JOIN different from a WHERE-based old-style join?"],
difficulty:"Basic", importance:"must"});

add('joins',{q:"What does LEFT JOIN do? Find employees without a department.",
short:"LEFT JOIN returns every row from the left table, plus matching rows from the right table — and NULL for right-side columns when there's no match. It's the standard tool for finding 'missing' relationships.",
detail:"To find rows with no match, you LEFT JOIN and then filter WHERE the right table's key IS NULL, which only keeps rows that had nothing to join to.",
sql:"SELECT e.name\nFROM employees e\nLEFT JOIN departments d ON e.department_id = d.id\nWHERE d.id IS NULL;",
tip:"This exact pattern (LEFT JOIN + IS NULL) is one of the most-repeated SQL interview idioms — memorize it.",
follow:["How would you find departments with zero employees using the same idiom?","Why can't you filter with WHERE d.id IS NULL if you put the condition in the ON clause instead?"],
difficulty:"Basic", importance:"must"});

add('joins',{q:"Find departments that have no employees (RIGHT JOIN version).",
short:"A RIGHT JOIN keeps every row from the right table even without a match on the left — filtering for NULL on the left table's key finds departments nobody belongs to. It's functionally the mirror image of the LEFT JOIN pattern.",
detail:"RIGHT JOIN is less commonly used in practice because most people just swap table order and use LEFT JOIN instead — but interviewers still expect you to know RIGHT JOIN exists and behaves symmetrically.",
sql:"SELECT d.department_name\nFROM employees e\nRIGHT JOIN departments d ON e.department_id = d.id\nWHERE e.id IS NULL;",
tip:"Mention that this is equivalent to swapping table order and using LEFT JOIN — shows real understanding, not memorized syntax.",
follow:["Why do many style guides recommend avoiding RIGHT JOIN?","Is RIGHT JOIN slower than an equivalent LEFT JOIN?"],
difficulty:"Basic", importance:"important"});

add('joins',{q:"What is CROSS JOIN and when is it actually useful?",
short:"CROSS JOIN produces the Cartesian product — every row of table A paired with every row of table B, with no join condition. It's useful for generating combinations, like all product/size pairs, or building a calendar of dates against every store.",
detail:"Accidental cross joins (forgetting a join condition) are a classic interview trap and a classic production bug — they blow up result set size exponentially.",
sql:"SELECT p.product_name, s.size_label\nFROM products p\nCROSS JOIN sizes s;",
tip:"Flag the danger: an accidental CROSS JOIN from a missing ON clause is a top real-world SQL bug.",
follow:["How many rows does a CROSS JOIN of a 100-row and 50-row table produce?","How do you intentionally limit a CROSS JOIN's size?"],
difficulty:"Intermediate", importance:"important"});

add('joins',{q:"What is a SELF JOIN? Show the classic 'employee earns more than their manager' example.",
short:"A SELF JOIN joins a table to itself, typically using two aliases, to compare rows within the same table — like comparing an employee to their own manager, who is also a row in the employees table.",
detail:"This pattern is used constantly for hierarchical data (manager chains, category trees, org charts) stored in a single table with a self-referencing foreign key.",
sql:"SELECT e.name AS employee, m.name AS manager\nFROM employees e\nJOIN employees m ON e.manager_id = m.id\nWHERE e.salary > m.salary;",
tip:"Always alias both sides clearly (e / m) — interviewers watch whether your aliasing keeps the query readable.",
follow:["How would you find the top of the hierarchy (employees with no manager)?","How deep can you traverse with a single self join versus a recursive CTE?"],
difficulty:"Intermediate", importance:"must"});

add('joins',{q:"How do you join 3 or 4 tables together?",
short:"Chain multiple JOIN clauses, each with its own ON condition, connecting tables through their foreign key relationships — order generally follows the logical relationship path, though the optimizer can reorder internally.",
detail:"Readability matters: alias every table, keep ON conditions directly under each JOIN, and only pull the columns you actually need. For deeply nested relationships, sometimes a subquery or CTE per logical group is clearer than one giant join chain.",
sql:"SELECT o.id AS order_id, c.name AS customer, p.product_name, oi.quantity\nFROM orders o\nJOIN customers c ON o.customer_id = c.id\nJOIN order_items oi ON oi.order_id = o.id\nJOIN products p ON oi.product_id = p.id;",
tip:"Narrate the relationship path out loud (orders→customers, orders→items→products) — it shows you're modeling the schema, not guessing.",
follow:["How would you add a filter for orders placed in the last 30 days?","What happens to performance as you add more joined tables?"],
difficulty:"Intermediate", importance:"must"});

add('joins',{q:"Find customers who have never placed an order.",
short:"LEFT JOIN customers to orders and filter WHERE the order's key IS NULL — this returns customers with zero matching rows in the orders table.",
detail:"This is functionally identical to a NOT EXISTS or NOT IN subquery, but is often the most intuitive to write and, in many MySQL versions, performs comparably or better when indexes are in place.",
sql:"SELECT c.id, c.name\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;",
tip:"Interviewers may ask you to rewrite this with NOT EXISTS on the spot — be ready to do both.",
follow:["Rewrite this using NOT EXISTS.","Why can NOT IN silently return zero rows if the subquery contains a NULL?"],
difficulty:"Basic", importance:"must"});

add('joins',{q:"Find duplicate records using a JOIN.",
short:"Self-join the table on the columns that define a duplicate (e.g. email) with a condition that the primary keys differ, which surfaces every pair of rows sharing those values.",
detail:"For reporting purposes, this is often combined with GROUP BY and HAVING COUNT(*) > 1 instead, which is simpler when you just need to know which values are duplicated rather than every duplicate pair.",
sql:"SELECT a.id, a.email\nFROM customers a\nJOIN customers b ON a.email = b.email AND a.id <> b.id;",
tip:"Mention the GROUP BY / HAVING alternative unprompted — it shows you know more than one way to solve it.",
follow:["How would you keep only one copy and delete the rest safely?","Which approach is more efficient on a large table?"],
difficulty:"Intermediate", importance:"must"});

add('joins',{q:"Find the highest salary in each department using JOIN.",
short:"Join employees to a derived table that computes MAX(salary) per department, matching on department_id and salary equal to that max — this returns the actual employee row(s) at the top of each department.",
detail:"A correlated subquery or window function (RANK() OVER (PARTITION BY department_id ORDER BY salary DESC)) can achieve the same result, and window functions are usually cleaner when ties need specific handling.",
sql:"SELECT e.*\nFROM employees e\nJOIN (\n  SELECT department_id, MAX(salary) AS max_salary\n  FROM employees GROUP BY department_id\n) m ON e.department_id = m.department_id AND e.salary = m.max_salary;",
tip:"If MySQL 8+ is assumed, offer the window function version too — it signals modern SQL fluency.",
follow:["Rewrite this using RANK() OVER (PARTITION BY ...).","What happens with this query if two employees tie for the max salary?"],
difficulty:"Advanced", importance:"must"});

add('joins',{q:"JOIN vs Subquery — how do you decide which to use?",
short:"A JOIN combines rows from two tables into a single result set and is generally the optimizer's preferred approach for retrieving related columns together. A subquery is often clearer for existence checks, aggregated filters, or when you only need to filter — not display — data from the other table.",
detail:"Modern query optimizers frequently rewrite subqueries into joins internally (semi-joins), so performance differences have narrowed, but readability and intent still guide the choice: JOIN when you need columns from both tables, subquery when you just need a condition.",
sql:"-- JOIN version\nSELECT DISTINCT c.name FROM customers c JOIN orders o ON o.customer_id = c.id;\n\n-- Subquery version\nSELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders);",
tip:"Say the optimizer often treats them the same under the hood — that nuance separates strong candidates from memorized answers.",
follow:["When would a correlated subquery be significantly slower than a join?","What is a semi-join?"],
difficulty:"Intermediate", importance:"must"});

add('joins',{q:"JOIN vs EXISTS — what's the practical difference?",
short:"JOIN returns combined columns from both tables and can multiply rows when there are multiple matches. EXISTS only checks whether at least one matching row exists and returns a boolean, so it never duplicates the outer row even with multiple matches.",
detail:"When you only need to filter customers who have at least one order (not list their orders), EXISTS avoids the risk of accidental row duplication that a naive JOIN could introduce, and it can short-circuit as soon as one match is found.",
sql:"SELECT c.name\nFROM customers c\nWHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);",
tip:"Emphasize 'EXISTS can't duplicate rows, a JOIN can' — that's the concrete practical risk interviewers want you to spot.",
follow:["Why is SELECT 1 used instead of SELECT * inside EXISTS?","When would you need DISTINCT after a JOIN that EXISTS wouldn't require?"],
difficulty:"Intermediate", importance:"important"});

add('joins',{q:"How do you use JOIN together with GROUP BY and HAVING?",
short:"JOIN first assembles the combined rows, GROUP BY collapses them into groups based on chosen columns, and HAVING filters those groups using aggregate conditions — unlike WHERE, which filters rows before grouping happens.",
detail:"A common pattern is joining orders to customers, grouping by customer, and using HAVING COUNT(*) > 3 to find frequent buyers — something WHERE cannot do because COUNT doesn't exist until after grouping.",
sql:"SELECT c.name, COUNT(o.id) AS order_count\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name\nHAVING COUNT(o.id) > 3;",
tip:"Say the logical order out loud: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY — this single sentence answers a lot of follow-ups pre-emptively.",
follow:["What's the actual logical execution order of a SELECT statement?","Why can't you use a column alias from SELECT inside a WHERE clause?"],
difficulty:"Intermediate", importance:"must"});

/* ---------------- INDEXES ---------------- */
add('indexes',{q:"What is an index and why do we need it?",
short:"An index is a separate data structure (typically a B-tree) that stores a sorted reference to column values and their row locations, letting MySQL find matching rows without scanning the entire table.",
detail:"Without an index, MySQL performs a full table scan for most lookups — reading every row to check the condition. An index turns that into a fast lookup, similar to using a book's index instead of reading every page to find a topic.",
sql:"CREATE INDEX idx_employees_dept ON employees(department_id);",
tip:"The 'book index' analogy is a great opener — simple, correct, and memorable to an interviewer.",
follow:["What data structure does MySQL's InnoDB use for indexes by default?","Does every column need an index?"],
difficulty:"Basic", importance:"must"});

add('indexes',{q:"Primary key index vs unique index vs composite index — explain the differences.",
short:"A primary key index enforces uniqueness and non-nullability and is the clustered index in InnoDB, physically ordering table data. A unique index enforces uniqueness but allows one NULL (per column) and doesn't have to be the clustering key. A composite index spans multiple columns and is ordered by those columns left to right.",
detail:"InnoDB stores table rows physically ordered by the primary key (a clustered index), so lookups by primary key are especially fast. Composite indexes only help queries that filter using a left-to-right prefix of the indexed columns.",
sql:"CREATE UNIQUE INDEX idx_users_email ON users(email);\nCREATE INDEX idx_orders_cust_date ON orders(customer_id, order_date);",
tip:"Mention InnoDB's clustered-index behavior for the primary key — it's a detail that separates strong candidates.",
follow:["What is the leftmost-prefix rule for composite indexes?","Can a table have more than one primary key?"],
difficulty:"Intermediate", importance:"must"});

add('indexes',{q:"What is the leftmost-prefix rule?",
short:"A composite index on (a, b, c) can be used to speed up queries filtering on a, or on a+b, or on a+b+c — but not on b alone or c alone, because the index is physically sorted by a first, then b, then c.",
detail:"This is one of the most commonly tested indexing concepts. Filtering on a non-leading column of a composite index generally forces a full index scan or table scan instead of an efficient range lookup, unless that column is separately indexed.",
sql:"CREATE INDEX idx_abc ON orders(customer_id, status, order_date);\n-- Uses index:      WHERE customer_id = 5\n-- Uses index:      WHERE customer_id = 5 AND status = 'paid'\n-- Does NOT use it:  WHERE status = 'paid'  (customer_id skipped)",
tip:"Draw the analogy to a phone book sorted by last name then first name — you can't binary-search by first name alone.",
follow:["Does column order in the CREATE INDEX statement matter?","How would you support queries filtering on either column efficiently?"],
difficulty:"Intermediate", importance:"must"});

add('indexes',{q:"What is a covering index?",
short:"A covering index contains every column a query needs — both the filter columns and the selected columns — so MySQL can satisfy the entire query from the index alone without touching the underlying table rows.",
detail:"This avoids the extra 'bookmark lookup' step of jumping from the index back to the clustered data, which can be a major performance win for read-heavy, narrow queries.",
sql:"CREATE INDEX idx_covering ON orders(customer_id, order_date, status);\n\n-- Covered entirely by the index above:\nSELECT order_date, status FROM orders WHERE customer_id = 42;",
tip:"Say 'Using index' — that's the literal phrase you'd see in EXPLAIN output confirming a covering index is being used.",
follow:["How do you confirm a query is using a covering index?","What's the trade-off of adding more columns to make an index 'covering'?"],
difficulty:"Advanced", importance:"important"});

add('indexes',{q:"What are index selectivity and cardinality, and why do they matter?",
short:"Cardinality is the number of distinct values in a column; selectivity is that cardinality relative to the total row count. High-selectivity columns (like email, near-unique) make great index candidates; low-selectivity columns (like a boolean 'is_active' flag) usually don't benefit much from indexing.",
detail:"MySQL's optimizer may skip an index entirely on a low-selectivity column because scanning the table directly is cheaper than jumping between the index and the table for a large fraction of all rows.",
sql:"SELECT COUNT(DISTINCT status) AS distinct_values, COUNT(*) AS total_rows\nFROM orders;",
tip:"Give a concrete contrast: 'email is high selectivity, gender or a boolean flag is low selectivity' — concrete examples land better than definitions alone.",
follow:["Would you index a boolean column? Why or why not?","How does the optimizer decide whether to use an index at all?"],
difficulty:"Advanced", importance:"important"});

add('indexes',{q:"When does MySQL choose NOT to use an existing index?",
short:"MySQL skips an index when a full table scan is estimated to be cheaper — commonly when the filter matches a large fraction of rows, when a function is applied to the indexed column, when there's an implicit type mismatch, or when a leading wildcard LIKE '%term' is used.",
detail:"Wrapping an indexed column in a function (WHERE YEAR(order_date) = 2024) prevents the index from being used because the stored index values no longer match the transformed expression directly — rewriting as a range (order_date >= '2024-01-01' AND order_date < '2025-01-01') restores index usage.",
sql:"-- Index NOT used (function on column)\nSELECT * FROM orders WHERE YEAR(order_date) = 2024;\n\n-- Index used (range on raw column)\nSELECT * FROM orders WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01';",
tip:"This exact YEAR() example is a favorite live-coding gotcha — have it memorized.",
follow:["What does a leading wildcard LIKE do to index usage?","How do implicit type conversions break index usage?"],
difficulty:"Advanced", importance:"must"});

add('indexes',{q:"What's the downside of adding too many indexes?",
short:"Every index has to be updated on every INSERT, UPDATE, or DELETE, so more indexes mean slower writes and more disk/memory usage. Indexes can also confuse the optimizer into picking a suboptimal plan, and unused indexes are pure overhead.",
detail:"The general guidance is to index based on actual query patterns (WHERE, JOIN, ORDER BY columns) rather than indexing every column defensively, and to periodically review and drop indexes that aren't being used.",
sql:"-- Find unused indexes (MySQL 8, via performance_schema)\nSELECT * FROM sys.schema_unused_indexes;",
tip:"Frame it as a read/write trade-off — that framing is exactly what senior interviewers want to hear.",
follow:["How would you find unused indexes in a production database?","What's the cost of an index on a very high-write table?"],
difficulty:"Intermediate", importance:"must"});

add('indexes',{q:"How do you use EXPLAIN, and what should you look for?",
short:"EXPLAIN shows the execution plan MySQL intends to use for a query — including which indexes (if any) it will use, the join order, and an estimated number of rows examined. Key things to check: 'type' (ALL means full scan, bad), 'key' (which index is actually used), and 'rows' (estimated rows scanned).",
detail:"A 'type' of ALL on a large table is a red flag; ref, range, or const are much better. 'Extra' showing 'Using filesort' or 'Using temporary' often points to missing indexes on ORDER BY or GROUP BY columns.",
sql:"EXPLAIN SELECT * FROM orders WHERE customer_id = 42 AND status = 'paid';",
tip:"Naming 'type', 'key', and 'rows' specifically shows hands-on experience, not just textbook knowledge.",
follow:["What does 'Using filesort' mean and how do you fix it?","What's the difference between EXPLAIN and EXPLAIN ANALYZE?"],
difficulty:"Advanced", importance:"must"});

/* ---------------- TRANSACTIONS ---------------- */
add('transactions',{q:"What is a transaction and why does it matter?",
short:"A transaction is a group of one or more SQL statements executed as a single all-or-nothing unit — either every statement succeeds and is committed, or if any part fails, the whole group is rolled back, leaving the database as if nothing happened.",
detail:"Transactions are essential whenever multiple related writes must stay consistent with each other, like debiting one account and crediting another — you never want only one half to succeed.",
sql:"START TRANSACTION;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;",
tip:"The bank transfer example is the canonical one — use it, interviewers expect it and it's genuinely the clearest illustration.",
follow:["What happens if the connection drops mid-transaction?","Does every storage engine in MySQL support transactions?"],
difficulty:"Basic", importance:"must"});

add('transactions',{q:"Explain COMMIT, ROLLBACK, and SAVEPOINT.",
short:"COMMIT permanently saves all changes made in the current transaction. ROLLBACK undoes all changes since the transaction began (or since a named SAVEPOINT). SAVEPOINT marks a point inside a transaction you can roll back to without discarding everything before it.",
detail:"Savepoints are useful in long, multi-step transactions where you want the option to undo just the most recent part of the work if a later step fails, without losing the earlier successful steps.",
sql:"START TRANSACTION;\nUPDATE accounts SET balance = balance - 50 WHERE id = 1;\nSAVEPOINT after_debit;\nUPDATE accounts SET balance = balance + 50 WHERE id = 999; -- wrong id\nROLLBACK TO after_debit;\nUPDATE accounts SET balance = balance + 50 WHERE id = 2;\nCOMMIT;",
tip:"Walk through the savepoint example step by step out loud — it demonstrates real understanding, not memorized definitions.",
follow:["Can you ROLLBACK after a COMMIT?","What happens to savepoints once you COMMIT?"],
difficulty:"Basic", importance:"must"});

add('transactions',{q:"Explain the ACID properties with a concrete example.",
short:"Atomicity: all statements in a transaction succeed or none do. Consistency: the database moves from one valid state to another, respecting constraints. Isolation: concurrent transactions don't see each other's uncommitted changes. Durability: once committed, changes survive even a crash.",
detail:"Using a bank transfer: Atomicity ensures both the debit and credit happen together; Consistency ensures total money in the system stays correct; Isolation ensures another transaction reading balances mid-transfer doesn't see a half-finished state; Durability ensures the transfer isn't lost if the server crashes right after COMMIT.",
sql:null,
tip:"Map each ACID letter to one line of the bank-transfer example — this is the single most expected answer format for this question.",
follow:["Which ACID property is most relevant to preventing race conditions?","How does InnoDB achieve durability (hint: redo log)?"],
difficulty:"Basic", importance:"must"});

add('transactions',{q:"What transaction isolation levels does MySQL support, and what's the default?",
short:"MySQL (InnoDB) supports READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, and SERIALIZABLE. The default is REPEATABLE READ, which is stricter than most other databases' defaults and prevents non-repeatable reads within a transaction using MVCC snapshots.",
detail:"Higher isolation levels reduce anomalies but can increase locking and reduce concurrency. REPEATABLE READ in InnoDB also largely avoids phantom reads for normal SELECTs thanks to a consistent snapshot, though SELECT ... FOR UPDATE can still encounter them.",
sql:"SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;",
tip:"Say the MySQL default explicitly (REPEATABLE READ) — many candidates blank on this specific fact.",
follow:["What anomaly does each isolation level allow or prevent?","Why might you deliberately lower isolation to READ COMMITTED?"],
difficulty:"Advanced", importance:"must"});

add('transactions',{q:"What happens if a transaction is left open and never committed or rolled back?",
short:"Long-running open transactions hold locks and prevent InnoDB from purging old row versions needed for MVCC, which can bloat the undo log, slow down other queries waiting on locks, and degrade overall database performance.",
detail:"This is a common production incident — a forgotten transaction (often from a bug or an app crash mid-transaction) can silently hold row locks for hours, causing seemingly unrelated queries to hang.",
sql:"-- Inspect long-running transactions\nSELECT * FROM information_schema.innodb_trx\nORDER BY trx_started;",
tip:"Mentioning MVCC/undo log bloat as a side effect (not just 'locks stay held') shows deeper InnoDB knowledge.",
follow:["How would you detect and kill a stuck transaction in production?","What's a reasonable transaction timeout strategy?"],
difficulty:"Advanced", importance:"important"});

/* ---------------- CONCURRENCY / RACE CONDITIONS ---------------- */
add('concurrency',{q:"What is a race condition in a database context? Give a concrete example.",
short:"A race condition happens when two transactions read and write shared data at nearly the same time without proper coordination, causing one update to silently overwrite or ignore the effect of the other. Classic example: two users buying the last unit of stock simultaneously, both reading stock=1, both deciding to proceed, and stock ending at -1.",
detail:"The root cause is a 'read, then decide, then write' pattern executed by two transactions without a lock or atomic check in between — the decision each transaction makes is based on stale information by the time it writes.",
sql:null,
tip:"Use the 'last item in stock' example every time — it's the industry-standard illustration and interviewers expect it.",
follow:["Why doesn't simply wrapping the read+write in a transaction alone fix this?","What's the difference between a race condition and a deadlock?"],
difficulty:"Basic", importance:"must"});

add('concurrency',{q:"Explain the 'lost update' problem.",
short:"A lost update happens when two transactions both read the same value, both compute a new value based on that read, and the second COMMIT silently overwrites the first transaction's change — as if the first update never happened.",
detail:"This is common with naive 'read balance, compute new balance in application code, write it back' patterns. The fix is to update atomically in SQL (UPDATE ... SET balance = balance - 10) or use row locking (SELECT ... FOR UPDATE) so the second transaction waits and sees the first transaction's result before computing its own.",
sql:"-- Vulnerable pattern (read-modify-write in application code)\n-- SELECT balance FROM accounts WHERE id=1;   -- app reads 100\n-- app computes 100 - 10 = 90\n-- UPDATE accounts SET balance = 90 WHERE id=1;\n\n-- Safe pattern (atomic in SQL)\nUPDATE accounts SET balance = balance - 10 WHERE id = 1;",
tip:"Show both the vulnerable pattern and the fix side by side — that contrast is exactly what interviewers want to see.",
follow:["Does an atomic UPDATE fully eliminate the need for transactions?","How does optimistic locking (a version column) solve this differently?"],
difficulty:"Intermediate", importance:"must"});

add('concurrency',{q:"Dirty read, non-repeatable read, and phantom read — define each.",
short:"A dirty read sees another transaction's uncommitted changes, which might later be rolled back. A non-repeatable read happens when re-reading the same row within one transaction returns different values because another transaction committed a change in between. A phantom read happens when re-running the same range query returns a different set of rows because another transaction inserted or deleted matching rows in between.",
detail:"These three anomalies map directly onto the isolation levels: READ UNCOMMITTED allows all three; READ COMMITTED prevents dirty reads but allows the other two; REPEATABLE READ (MySQL's default) also prevents non-repeatable reads and largely phantom reads via MVCC; SERIALIZABLE prevents all of them.",
sql:null,
tip:"Recite them in order of severity (dirty → non-repeatable → phantom) mapped to isolation levels — this structure makes the answer feel complete.",
follow:["Which of these does MySQL's default isolation level prevent?","How does MVCC help prevent non-repeatable reads without locking?"],
difficulty:"Advanced", importance:"must"});

add('concurrency',{q:"What is row locking and how does SELECT ... FOR UPDATE work?",
short:"Row locking prevents other transactions from modifying (or in some modes, even reading) a specific row until the locking transaction commits or rolls back. SELECT ... FOR UPDATE explicitly locks the rows it reads, forcing any other transaction that tries to update or also SELECT ... FOR UPDATE the same rows to wait.",
detail:"This is the standard mechanism to safely implement 'check then act' logic: lock the row, check the condition (like stock > 0) with guaranteed fresh data, then update — all within one transaction, so no other transaction can slip in between the check and the write.",
sql:"START TRANSACTION;\nSELECT stock FROM products WHERE id = 42 FOR UPDATE;\n-- application confirms stock > 0\nUPDATE products SET stock = stock - 1 WHERE id = 42;\nCOMMIT;",
tip:"This is the single most likely code example to be requested live — have it memorized character for character.",
follow:["What's the difference between FOR UPDATE and FOR SHARE (LOCK IN SHARE MODE)?","How could this same pattern still deadlock?"],
difficulty:"Advanced", importance:"must"});

add('concurrency',{q:"What is a deadlock, and how does MySQL handle it?",
short:"A deadlock occurs when two transactions each hold a lock the other one needs, so both wait forever — for example, Transaction A locks row 1 and wants row 2, while Transaction B locks row 2 and wants row 1. InnoDB detects this automatically and kills one of the transactions (rolling it back) so the other can proceed.",
detail:"The killed transaction receives a 'Deadlock found when trying to get lock' error and the application should catch it and retry the transaction. The best prevention is to always access rows/tables in a consistent order across all transactions.",
sql:"-- Transaction A\nUPDATE accounts SET balance = balance - 10 WHERE id = 1; -- locks row 1\nUPDATE accounts SET balance = balance + 10 WHERE id = 2; -- waits for row 2\n\n-- Transaction B (interleaved)\nUPDATE accounts SET balance = balance - 5  WHERE id = 2; -- locks row 2\nUPDATE accounts SET balance = balance + 5  WHERE id = 1; -- waits for row 1 -> DEADLOCK",
tip:"State the fix explicitly: 'always lock rows in the same order' — that one sentence is the practical takeaway interviewers want.",
follow:["How would your application detect and retry after a deadlock?","How is a deadlock different from one transaction simply waiting a long time for a lock?"],
difficulty:"Advanced", importance:"must"});

add('concurrency',{q:"How would you prevent two users from buying the last item in stock at the same time?",
short:"Wrap the check-and-decrement in a single transaction using SELECT ... FOR UPDATE (or an atomic conditional UPDATE with a WHERE stock > 0 clause) so the second transaction either waits and sees the updated stock, or its UPDATE simply affects zero rows and fails safely.",
detail:"The simplest robust fix is often the atomic UPDATE approach: UPDATE products SET stock = stock - 1 WHERE id = 42 AND stock > 0, then check ROW_COUNT() — if 0 rows were affected, someone else already took the last unit, and you cancel that order cleanly without ever needing an explicit lock statement.",
sql:"START TRANSACTION;\nUPDATE products SET stock = stock - 1 WHERE id = 42 AND stock > 0;\n-- if ROW_COUNT() = 0 -> out of stock, ROLLBACK\n-- else -> proceed to create order, COMMIT\nCOMMIT;",
tip:"This is essentially the flagship interview question for this whole topic — be ready to write it from memory and explain ROW_COUNT() = 0 handling.",
follow:["Why is this safer than SELECT then IF then UPDATE in separate statements?","How would optimistic locking with a version column solve the same problem?"],
difficulty:"Advanced", importance:"must"});

add('concurrency',{q:"What's the difference between optimistic and pessimistic locking?",
short:"Pessimistic locking (SELECT ... FOR UPDATE) assumes conflicts are likely, so it locks rows upfront and makes other transactions wait. Optimistic locking assumes conflicts are rare — it reads data with a version number or timestamp, and only at write time checks whether that version still matches, retrying if someone else already changed it.",
detail:"Optimistic locking scales better under high read concurrency and low write-conflict scenarios since it avoids holding locks, but requires application-level retry logic. Pessimistic locking is simpler to reason about but can reduce throughput under contention.",
sql:"-- Optimistic locking with a version column\nUPDATE products\nSET stock = stock - 1, version = version + 1\nWHERE id = 42 AND version = 7;\n-- if ROW_COUNT() = 0, someone else updated it first -> retry",
tip:"Frame it as 'lock now vs. verify at commit time' — that phrase cleanly separates the two approaches.",
follow:["Which approach would you choose for a high-traffic flash sale?","How do you handle the retry loop for optimistic locking in application code?"],
difficulty:"Advanced", importance:"important"});

/* ---------------- CONSTRAINTS & KEYS ---------------- */
add('constraints',{q:"List the main SQL constraints and what each one enforces.",
short:"PRIMARY KEY uniquely identifies each row and disallows NULLs. FOREIGN KEY enforces referential integrity to another table. UNIQUE disallows duplicate values but permits one NULL. NOT NULL requires a value. DEFAULT supplies a value when none is given. CHECK enforces a boolean condition on the column's value.",
detail:"Constraints move validation into the database itself, guaranteeing data integrity even if application code has bugs or multiple applications write to the same database.",
sql:"CREATE TABLE employees(\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  email VARCHAR(100) UNIQUE NOT NULL,\n  department_id INT,\n  salary DECIMAL(10,2) DEFAULT 0 CHECK (salary >= 0),\n  FOREIGN KEY (department_id) REFERENCES departments(id)\n);",
tip:"Rattle these off with one clause each — interviewers usually just want a fast, accurate checklist.",
follow:["Can a table have multiple UNIQUE constraints?","Does MySQL enforce CHECK constraints in all versions?"],
difficulty:"Basic", importance:"must"});

add('constraints',{q:"Primary Key vs Unique — what's the actual difference?",
short:"A table can have only one PRIMARY KEY, which disallows NULLs entirely and is typically the clustered index in InnoDB. A table can have multiple UNIQUE constraints, and a UNIQUE column can accept one NULL value (since NULL is never considered equal to another NULL).",
detail:"Use PRIMARY KEY for the single column (or set) that identifies each row for relationships and physical storage ordering. Use UNIQUE for other columns, like email or username, that must be distinct but aren't the row's main identity.",
sql:"CREATE TABLE users(\n  id INT PRIMARY KEY,\n  email VARCHAR(100) UNIQUE\n);",
tip:"The 'one PK vs many UNIQUE' and 'PK disallows NULL, UNIQUE allows one NULL' pair of facts is exactly what's tested here.",
follow:["Can a UNIQUE constraint span multiple columns?","Why is NULL allowed in a UNIQUE column but not a PRIMARY KEY?"],
difficulty:"Basic", importance:"must"});

add('constraints',{q:"Primary Key vs Foreign Key — how do they relate?",
short:"A PRIMARY KEY uniquely identifies rows within its own table. A FOREIGN KEY is a column (or set of columns) in one table that references a PRIMARY KEY (or unique key) in another table, enforcing that the referenced value must actually exist there.",
detail:"Foreign keys are how relational databases represent relationships — e.g. every employee's department_id must correspond to a real row in the departments table. This is what 'referential integrity' means.",
sql:"CREATE TABLE departments(id INT PRIMARY KEY, name VARCHAR(50));\nCREATE TABLE employees(\n  id INT PRIMARY KEY,\n  department_id INT,\n  FOREIGN KEY (department_id) REFERENCES departments(id)\n);",
tip:"Say 'foreign key points to another table's primary key' in one breath — clean, correct, and exactly what's expected.",
follow:["What happens if you try to insert an employee with a non-existent department_id?","What ON DELETE options can a foreign key have?"],
difficulty:"Basic", importance:"must"});

add('constraints',{q:"DELETE vs ON DELETE CASCADE — explain the relationship.",
short:"DELETE is the statement that removes rows from a table. ON DELETE CASCADE is a foreign key option that automatically deletes matching child rows when the parent row is deleted, so you don't have to manually delete dependents first.",
detail:"Without CASCADE (or another ON DELETE rule), deleting a parent row that still has children referencing it will fail with a foreign key constraint error, protecting you from orphaned data — CASCADE opts into automatic cleanup instead.",
sql:"CREATE TABLE orders(\n  id INT PRIMARY KEY,\n  customer_id INT,\n  FOREIGN KEY (customer_id) REFERENCES customers(id) ON DELETE CASCADE\n);\n\nDELETE FROM customers WHERE id = 5; -- also deletes that customer's orders",
tip:"Warn about the danger of CASCADE in production — deleting one row can silently delete far more than expected.",
follow:["What other ON DELETE options exist besides CASCADE (e.g. SET NULL, RESTRICT)?","When would ON DELETE CASCADE be dangerous in production?"],
difficulty:"Intermediate", importance:"important"});

add('constraints',{q:"Explain composite key, candidate key, and surrogate key.",
short:"A composite key is a primary key made of two or more columns together (e.g. order_id + product_id in an order_items table). A candidate key is any column or column-set that could validly serve as the primary key. A surrogate key is an artificial, meaningless identifier (like an auto-increment integer) used instead of a natural business key.",
detail:"Surrogate keys are popular because natural/business keys (like email or SSN) can change or have edge cases, while a surrogate key stays stable and simple for use in foreign key relationships throughout the schema.",
sql:"CREATE TABLE order_items(\n  order_id INT,\n  product_id INT,\n  quantity INT,\n  PRIMARY KEY (order_id, product_id) -- composite key\n);",
tip:"Order items / junction tables are the standard example for composite keys — use that exact scenario.",
follow:["Why might you prefer a surrogate key over a natural key even when a natural unique value exists?","Can a composite key also be a foreign key?"],
difficulty:"Intermediate", importance:"important"});

/* ---------------- AGGREGATE FUNCTIONS ---------------- */
add('aggregate',{q:"WHERE vs HAVING — what's the difference and why does it matter?",
short:"WHERE filters individual rows before any grouping happens, and cannot reference aggregate functions. HAVING filters groups after GROUP BY has produced them, and is the only place you can filter using an aggregate condition like COUNT(*) > 3.",
detail:"A common mistake is trying to write WHERE COUNT(*) > 3 — that fails because COUNT doesn't exist yet at the point WHERE is evaluated in the logical query order. That condition must go in HAVING instead.",
sql:"SELECT department_id, COUNT(*) AS emp_count\nFROM employees\nWHERE status = 'active'\nGROUP BY department_id\nHAVING COUNT(*) > 5;",
tip:"Say 'WHERE filters rows, HAVING filters groups' — it's short, correct, and exactly the phrase interviewers expect.",
follow:["Can you use HAVING without GROUP BY?","Is there a performance difference between filtering early in WHERE versus late in HAVING when possible?"],
difficulty:"Basic", importance:"must"});

add('aggregate',{q:"COUNT(*) vs COUNT(column) — what's the difference?",
short:"COUNT(*) counts every row in the group regardless of NULLs. COUNT(column) only counts rows where that specific column is NOT NULL, so it can return a smaller number than COUNT(*) when the column has NULL values.",
detail:"This distinction matters a lot for questions like 'how many employees have a phone number on file' — that's COUNT(phone_number), not COUNT(*).",
sql:"SELECT COUNT(*) AS total_employees, COUNT(phone_number) AS employees_with_phone\nFROM employees;",
tip:"Give the exact concrete example (phone number) — it makes the abstract rule immediately tangible.",
follow:["Does COUNT(DISTINCT column) also ignore NULLs?","Is COUNT(*) or COUNT(1) faster in InnoDB?"],
difficulty:"Basic", importance:"must"});

add('aggregate',{q:"Find departments having more than 5 employees.",
short:"Group employees by department, then use HAVING to filter groups whose row count exceeds 5 — a direct, textbook use of GROUP BY combined with HAVING.",
detail:"This pattern generalizes to any 'find groups meeting an aggregate threshold' question — swap COUNT for SUM, AVG, or MAX depending on what's being asked.",
sql:"SELECT department_id, COUNT(*) AS emp_count\nFROM employees\nGROUP BY department_id\nHAVING COUNT(*) > 5;",
tip:"Point out this is the general template for almost every 'find X with more than N Y' interview question.",
follow:["How would you also show the department name, not just its id?","How would you find departments with fewer than 5 but more than 0 employees?"],
difficulty:"Basic", importance:"must"});

add('aggregate',{q:"Find customers with more than 3 orders.",
short:"Join orders to customers (or just group the orders table directly by customer_id), then filter with HAVING COUNT(*) > 3 to isolate frequent buyers.",
detail:"If you need the customer's name, you join to the customers table; if you only need the customer_id and count, grouping the orders table alone is enough and slightly more efficient.",
sql:"SELECT c.id, c.name, COUNT(o.id) AS order_count\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name\nHAVING COUNT(o.id) > 3;",
tip:"Mention you'd drop the join entirely if you only needed the ID — shows you optimize for the actual requirement.",
follow:["How would you also require those orders to be from the last 90 days?","How would this change if a customer could have duplicate order rows to exclude?"],
difficulty:"Basic", importance:"important"});

add('aggregate',{q:"Find department-wise average salary, and departments above the company-wide average.",
short:"Compute AVG(salary) grouped by department for the first part; for the second part, compare each department's average against a scalar subquery that computes the overall company average.",
detail:"This combines aggregate functions, GROUP BY, and a subquery in one question — a common 'multi-step' interview pattern testing whether you can compose several SQL concepts together.",
sql:"SELECT department_id, AVG(salary) AS dept_avg\nFROM employees\nGROUP BY department_id\nHAVING AVG(salary) > (SELECT AVG(salary) FROM employees);",
tip:"Narrate that the subquery runs once and produces a single scalar value being compared against each group's average.",
follow:["Would this subquery be recalculated once or per group?","How would you round the average to 2 decimal places?"],
difficulty:"Intermediate", importance:"important"});

/* ---------------- SUBQUERIES ---------------- */
add('subqueries',{q:"What is a subquery, and what types exist?",
short:"A subquery is a query nested inside another query, used as a value, a list, or a condition. Types include single-row (returns one value), multi-row (returns a list, used with IN/ANY/ALL), and correlated (references a column from the outer query, re-evaluated per outer row).",
detail:"Subqueries can appear in SELECT, FROM (a derived table), WHERE, or HAVING clauses, making them one of the most flexible tools in SQL.",
sql:"-- single row\nSELECT name FROM employees WHERE salary = (SELECT MAX(salary) FROM employees);\n\n-- multi row\nSELECT name FROM employees WHERE department_id IN (SELECT id FROM departments WHERE location = 'NY');",
tip:"Categorize your example by type as you say it (\"this is a single-row subquery because...\") — narrating the classification impresses interviewers.",
follow:["What's a derived table and why does it need an alias?","Can a subquery in SELECT return more than one row?"],
difficulty:"Basic", importance:"must"});

add('subqueries',{q:"What is a correlated subquery? Give an example.",
short:"A correlated subquery references a column from the outer query, so it can't run independently — it's conceptually re-executed once per row of the outer query, using that row's value each time.",
detail:"A classic example is finding employees who earn more than the average salary of their own department (not the whole company) — the subquery's WHERE clause depends on the outer row's department_id.",
sql:"SELECT e.name, e.salary\nFROM employees e\nWHERE e.salary > (\n  SELECT AVG(salary) FROM employees e2 WHERE e2.department_id = e.department_id\n);",
tip:"Explicitly say 'this cannot run on its own because it references the outer table' — that's the defining trait interviewers listen for.",
follow:["How would you rewrite this using a window function instead?","Are correlated subqueries generally slower than joins? Why?"],
difficulty:"Advanced", importance:"must"});

add('subqueries',{q:"EXISTS / NOT EXISTS vs IN / NOT IN — which is safer, and why?",
short:"EXISTS/NOT EXISTS check row existence and are unaffected by NULLs in the subquery's result. IN is fine with non-NULL lists, but NOT IN silently returns zero rows for the entire query if the subquery's list contains even a single NULL — a very common, dangerous bug.",
detail:"Because of that NULL trap, many style guides recommend NOT EXISTS over NOT IN whenever the subquery column might contain NULLs — which is very often, especially with nullable foreign keys.",
sql:"-- Dangerous if customer_id has any NULLs in orders:\nSELECT * FROM customers WHERE id NOT IN (SELECT customer_id FROM orders);\n\n-- Safe alternative:\nSELECT * FROM customers c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);",
tip:"This NULL trap with NOT IN is one of the most-repeated 'gotcha' interview questions — know the exact failure mode, not just the fix.",
follow:["Why exactly does a single NULL break NOT IN but not IN?","Would adding a NOT NULL constraint on the subquery column make NOT IN safe again?"],
difficulty:"Advanced", importance:"must"});

add('subqueries',{q:"Subquery vs JOIN — when would a subquery clearly be the better choice?",
short:"A subquery is often clearer when you only need to filter based on another table's data without displaying any of its columns, or when checking existence/non-existence, or when the logic is naturally 'compare this row against an aggregate' (correlated subqueries).",
detail:"A JOIN is better when you actually need columns from both tables in the output, or when you're combining/matching multiple rows per side, since subqueries usually only contribute a filter, not additional output columns.",
sql:null,
tip:"Give the one-line rule: 'need columns from both tables → JOIN; just need a filter/condition → subquery'.",
follow:["Can every subquery be rewritten as a join, and vice versa?","How does the MySQL optimizer typically treat an IN subquery internally?"],
difficulty:"Intermediate", importance:"important"});

/* ---------------- VIEWS ---------------- */
add('views',{q:"What is a view and why would you use one?",
short:"A view is a stored, named SELECT query that behaves like a virtual table — querying it re-runs the underlying SQL each time. Views simplify complex queries, enforce a consistent way of looking at data, and can restrict which columns or rows different users are allowed to see.",
detail:"Views don't store data themselves (with the exception of materialized-view-like patterns not natively supported in MySQL) — they're a saved query definition that the database re-executes on demand.",
sql:"CREATE VIEW active_employees AS\nSELECT id, name, department_id\nFROM employees\nWHERE status = 'active';\n\nSELECT * FROM active_employees WHERE department_id = 3;",
tip:"Emphasize 'a view is just a saved query, not stored data' — that single clarification prevents a common misconception.",
follow:["Can you index a view directly in MySQL?","What's the performance cost of querying a view built on a complex join?"],
difficulty:"Basic", importance:"must"});

add('views',{q:"Can you update data through a view? What are the limits?",
short:"Yes, but only if the view is 'updatable' — generally meaning it comes from a single table (no joins, no GROUP BY, no aggregate functions, no DISTINCT, no subqueries in the SELECT list) so MySQL can unambiguously map the update back to the underlying table's rows.",
detail:"Views built from multiple tables or with aggregation are typically read-only, because there's no unambiguous way to translate a row-level update on the view back into the correct underlying table writes.",
sql:"UPDATE active_employees SET department_id = 4 WHERE id = 10;\n-- works only because active_employees maps 1:1 to a single underlying table's rows",
tip:"List the disqualifying features (joins, aggregates, GROUP BY, DISTINCT) — that's exactly the checklist interviewers want.",
follow:["What is WITH CHECK OPTION and what does it protect against?","Would a view with a WHERE clause let you update a row so it no longer matches that WHERE clause?"],
difficulty:"Intermediate", importance:"important"});

add('views',{q:"View vs Table — what's the fundamental difference?",
short:"A table physically stores data on disk. A view stores only a query definition and computes its result on the fly each time it's queried, always reflecting the current underlying data with no separate storage or sync step needed.",
detail:"Because a view has no independent storage, it can never become 'stale' relative to its base tables — but it also means querying a view built on a heavy query pays that query's cost every single time, unlike a table read.",
sql:null,
tip:"Say 'a view is a window, a table is the room' or similar analogy — memorable framing helps in a live interview.",
follow:["Does MySQL support materialized views?","How would you cache the result of an expensive view if performance became an issue?"],
difficulty:"Basic", importance:"must"});

add('views',{q:"View vs Stored Procedure — when would you choose each?",
short:"A view is queried like a table with SELECT (and sometimes simple DML) and always returns a result set shaped like a table. A stored procedure is called with CALL, can execute arbitrary logic including multiple statements, loops, and transactions, and can return zero, one, or multiple result sets or none at all.",
detail:"Use a view when you want to simplify or restrict access to a query as if it were a table. Use a procedure when you need control flow, multiple steps, side effects (writes), or business logic beyond a single SELECT shape.",
sql:null,
